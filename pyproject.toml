[project]
name = "mcp-scenario-engine"
version = "0.1.0"
description = "MCP Server for deterministic simulation and scenario planning"
authors = [{name = "MCP Scenario Engine", email = "info@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.29.1",
    "pydantic==2.13.5",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
    "black==26.5.1",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "DTZ", "T10", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PD", "PLE", "PLR", "PLW", "TRY", "RUF"]
ignore = ["ANN101", "ANN102", "PLR0913", "TRY003"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=39"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*", "src/mcp_scenario_engine/server.py"]
