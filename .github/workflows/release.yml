name: Release image

# Baut bei jedem Versions-Tag das Image und veroeffentlicht es auf GHCR:
#   ghcr.io/schimmilab/mcp-scenario-engine:<version> und :latest
# Nur der eingebaute GITHUB_TOKEN, kein eigenes Secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: docker/setup-buildx-action@v3.12.0

    - uses: docker/login-action@v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@v5.10.0
      with:
        images: ghcr.io/schimmilab/mcp-scenario-engine
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest
        labels: |
          org.opencontainers.image.title=mcp-scenario-engine
          org.opencontainers.image.description=MCP server for deterministic scenario simulations

    # Vor dem Push pruefen, dass der Server im Image wirklich als MCP antwortet —
    # ein Image, das baut, aber nicht startet, wird sonst sauber verteilt.
    - name: Build (local)
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        load: true
        tags: scenario-engine:check

    # Handshake ueber dieselbe Smoke-Action wie die CI (initialize + tools/list + Mindestzahl),
    # nicht mehr ueber eine printf-Pipe: eine Pipe kann stdin schliessen, bevor der Server
    # antwortet (05.10.2026 bei somneo-mcp-server lokal 0 Tools gemessen, obwohl er lief),
    # und "grep tools" prueft keine Anzahl. Vorab gegen das Image 1.2.1 gemessen:
    # 19 Tools gruen, min-tools 99 -> Exit 1.
    - name: MCP-Smoke gegen das Image
      uses: Schimmilab/mcp-smoke-action@v1
      with:
        command: docker run -i --rm scenario-engine:check
        min-tools: "17"

    - name: Push
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
