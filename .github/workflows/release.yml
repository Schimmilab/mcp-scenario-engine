name: Release image

# Baut bei jedem Versions-Tag das Image und veroeffentlicht es auf GHCR:
#   ghcr.io/schimmilab/mcp-scenario-engine:<version> und :latest
# Nur der eingebaute GITHUB_TOKEN, kein eigenes Secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/schimmilab/mcp-scenario-engine
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest
        labels: |
          org.opencontainers.image.title=mcp-scenario-engine
          org.opencontainers.image.description=MCP server for deterministic scenario simulations

    # Vor dem Push pruefen, dass der Server im Image wirklich als MCP antwortet —
    # ein Image, das baut, aber nicht startet, wird sonst sauber verteilt.
    - name: Build (local)
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: scenario-engine:check

    - name: MCP handshake
      run: |
        printf '%s\n' \
          '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
          '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
          '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | timeout 30 docker run -i --rm scenario-engine:check > out.jsonl || true
        cat out.jsonl
        grep -q '"id":2' out.jsonl && grep -q '"tools"' out.jsonl

    - name: Push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
